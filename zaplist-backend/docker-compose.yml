services:
  postgres:
    image: postgres:16
    container_name: zaplist-postgres
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"   # map host port from env to container 5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
